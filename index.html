<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beacon</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">

    <h1 class="logo">Beacon</h1>

    <p class="subtitle">
      AI Visibility Intelligence
    </p>

    <div class="form-group">
      <label for="businessName">
        Business Name
      </label>
      <input
        id="businessName"
        placeholder="Total Restoration of Texas"
      />
    </div>

    <div class="form-group">
      <label for="city">
        City
      </label>
      <input
        id="city"
        placeholder="Austin"
      />
    </div>

    <div class="form-group">
      <label for="category">
        Category
      </label>
      <input
        id="category"
        placeholder="Restoration Services"
      />
    </div>

    <button id="runAudit">
      Run Beacon Audit
    </button>

    <div class="output">
      <pre id="output">
Awaiting observation...
      </pre>
    </div>

    <div class="footer">
      Beacon • Observe → Understand → Recommend
    </div>

  </div>

  app.jsscript>
</body>
</html>
